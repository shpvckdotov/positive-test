version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpassword
      POSTGRES_DB: logclustering
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logclustering"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: "postgresql+asyncpg://loguser:logpassword@db:5432/logclustering"
      DATABASE_URL_SYNC: "postgresql://loguser:logpassword@db:5432/logclustering"
      MODEL_DIR: "/app/models"
      LINUX_LOG_PATH: "/app/data/sample_logs/linux.log"
      WINDOWS_LOG_PATH: "/app/data/sample_logs/windows.log"
      HDFS_LOG_PATH: "/app/data/sample_logs/hdfs.log"
    volumes:
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
  model_data:
